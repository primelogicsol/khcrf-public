events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance & Security Optimizations
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M; # Allows up to 20MB file uploads

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Use Docker's internal DNS resolver to dynamically resolve container IPs
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 1. Redirect ALL HTTP (Port 80) to HTTPS
    server {
        listen 80;
        server_name khcrf.org www.khcrf.org api.khcrf.org hcrf.org www.hcrf.org api.hcrf.org;

        # Needed for Certbot SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Frontend HTTPS Server (khcrf.org / hcrf.org)
    server {
        listen 443 ssl;
        server_name khcrf.org www.khcrf.org hcrf.org www.hcrf.org;

        ssl_certificate /etc/letsencrypt/live/khcrf.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/khcrf.org/privkey.pem;

        # SSL security best practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route /api/backend/ prefix requests to backend, rewriting to /api/
        location /api/backend/ {
            set $backend_upstream http://backend:4000;
            rewrite ^/api/backend/(.*)$ /api/$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/ prefix requests to backend
        location /api/ {
            set $backend_upstream http://backend:4000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend routing
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 3. Backend API HTTPS Server (api.khcrf.org / api.hcrf.org)
    server {
        listen 443 ssl;
        server_name api.khcrf.org api.hcrf.org;

        ssl_certificate /etc/letsencrypt/live/khcrf.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/khcrf.org/privkey.pem;

        # SSL security best practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route API requests to backend
        location / {
            set $backend_upstream http://backend:4000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; # CRITICAL: Tells Node it's HTTPS
            proxy_cache_bypass $http_upgrade;

            # Help cookies work across subdomains
            proxy_cookie_domain backend khcrf.org;
        }
    }
}