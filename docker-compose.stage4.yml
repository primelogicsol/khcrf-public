services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stage4
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stage4test}
      POSTGRES_DB: hcrf_stage4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage4 -d hcrf_stage4"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: localhost:5000/hcrf-backend:${BACKEND_SHA:-${RELEASE_SHA:-latest}}
    environment:
      - DATABASE_URL=postgresql://stage4:${DB_PASSWORD:-stage4test}@postgres:5432/hcrf_stage4
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - JWT_SECRET=stage4_dummy_secret
      - RELEASE_SHA=${RELEASE_SHA:-latest}
      - SIMULATE_HEALTH_FAILURE=${SIMULATE_BACKEND_FAILURE:-false}
      - SIMULATE_BACKEND_FAILURE=${SIMULATE_BACKEND_FAILURE:-false}
      - EMAIL_PROVIDER=disabled
      - PAYMENT_PROVIDER=disabled
      - CLUSTER_DISABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$SIMULATE_HEALTH_FAILURE\" = \"true\" ]; then exit 1; else curl -f http://localhost:4000/api/health; fi"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  frontend:
    image: localhost:5000/hcrf-frontend:${FRONTEND_SHA:-${RELEASE_SHA:-latest}}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
      - SIMULATE_HEALTH_FAILURE=${SIMULATE_FRONTEND_FAILURE:-false}
      - STAGE4_FAULT_INJECTION_ENABLED=${STAGE4_FAULT_INJECTION_ENABLED:-false}
      - SIMULATE_FRONTEND_FAILURE=${SIMULATE_FRONTEND_FAILURE:-false}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$SIMULATE_HEALTH_FAILURE\" = \"true\" ]; then exit 1; else curl -f http://localhost:3000/health; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.stage4.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
